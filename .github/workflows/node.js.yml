# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    strategy:
      matrix:
        node-version: [20.x] #[18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24 #${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
            node-version: 24 #${{ matrix.node-version }}
            
      #- name: Ensure compatible npm version
      #  run: npm install -g npm@latest

      # You must run npm ci or npm install before building/testing
      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      #- name: Rename build folder to public
      #  run: mv build public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
